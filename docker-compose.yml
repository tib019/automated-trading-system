services:
  # Trading / TradingView webhook API backend (PAPER_TRADING by default)
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=5001
      - TRADING_HOME=/app/data
    # Optional: drop your secrets into a .env file (see .env.example).
    # The stack also runs without it - it defaults to safe PAPER_TRADING.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React dashboard (nginx serves the build and proxies /api -> trading-api)
  trading-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - trading-network
    depends_on:
      - trading-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trading-network:
    driver: bridge
